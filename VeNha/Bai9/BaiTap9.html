<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 9 - Sử dụng Font Awesome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="BaiTap9.css">
</head>
<body>

    <div class="container">
        <h2><i class="fa-solid fa-gem"></i> Font Awesome Icons</h2>
        
        <ul class="icon-menu">
            <li>
                <a href="#">
                    <i class="fa-solid fa-house"></i>
                    <span>Trang chủ</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-user-astronaut"></i>
                    <span>Tài khoản</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Giỏ hàng</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-envelope"></i>
                    <span>Liên hệ</span>
                </a>
            </li>
        </ul>

        <div class="features">
            <div class="feature-card">
                <i class="fa-solid fa-rocket feature-icon"></i>
                <h3>Tốc độ cực nhanh</h3>
                <p>Tối ưu hiệu năng và trải nghiệm người dùng tối đa.</p>
            </div>
            <div class="feature-card">
                <i class="fa-solid fa-shield-halved feature-icon"></i>
                <h3>Bảo mật an toàn</h3>
                <p>Dữ liệu được mã hóa và bảo vệ 24/7.</p>
            </div>
            <div class="feature-card">
                <i class="fa-solid fa-heart feature-icon"></i>
                <h3>Yêu thích</h3>
                <p>Giao diện thân thiện và dễ dàng tùy biến.</p>
            </div>
        </div>
    </div>

</body>
</html>
